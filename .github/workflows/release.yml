name: Release

# Publishing a GitHub release builds the wasm from the tagged commit and
# attaches it. Actions artifacts (see build.yml) are not a substitute: they
# expire, and only signed-in users can download them - a release asset is a
# permanent, anonymous URL, which is what the README points people at.
on:
  release:
    types: [published]

permissions:
  contents: write

env:
  # Ref of gameap/gameap providing web/plugin-sdk; pin to a SHA if the SDK
  # drifts from frontend/package-lock.json
  GAMEAP_REF: main
  # Oldest panel the store should offer this plugin to. 4.4.0 is where the
  # gameap-net and gameap-scheduler host modules first shipped (absent in
  # 4.3.5), and the plugin cannot load without both. The 4.5-only pieces it
  # uses degrade rather than break: an older panel ignores the declared
  # required_permissions, and has no nodefs inline cap for the archive guard
  # to run into.
  MIN_GAMEAP_VERSION: "4.4.0"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin-cs2-addons

      # The frontend depends on file:../../gameap-api/web/plugin-sdk, so the
      # gameap repo must be checked out as a sibling directory named gameap-api.
      # (The Rust side pulls gameap-plugin-sdk as a cargo git dependency.)
      - uses: actions/checkout@v4
        with:
          repository: gameap/gameap
          ref: ${{ env.GAMEAP_REF }}
          path: gameap-api

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            gameap-api/web/plugin-sdk/package-lock.json
            plugin-cs2-addons/frontend/package-lock.json

      # The tag is the source of truth for the version: it is written into the
      # two places the panel actually reads - PluginInfo (Cargo.toml) and the
      # frontend PluginDefinition - before anything is built, then verified.
      # A tag that disagrees with the committed version is not an error; the
      # tag wins, and the built artifact says so.
      - name: Set version from tag
        working-directory: plugin-cs2-addons
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          sed -i "s/^version = \".*\"$/version = \"${VERSION}\"/" Cargo.toml
          sed -i "s/^    version: '.*',$/    version: '${VERSION}',/" frontend/src/index.ts
          # package.json and both root entries of package-lock.json count too:
          # src/consistency.rs checks all four copies and the Test step below
          # runs it, so rewriting only some of them fails the release. npm does
          # the lockfile correctly; a sed cannot, because dependency entries
          # carry a "version" key at the same indent as the root one.
          ( cd frontend && npm version "${VERSION}" --no-git-tag-version --allow-same-version >/dev/null )
          grep -q "^version = \"${VERSION}\"$" Cargo.toml
          grep -q "version: '${VERSION}'," frontend/src/index.ts
          grep -q "\"version\": \"${VERSION}\"" frontend/package.json

      # The @gameap/ui tarball on npm is missing its icons/ directory, so the
      # package from the gameap checkout is installed over it. SDK is built with
      # vite only ("npm run build" also runs tsc, which fails on @gameap/ui's
      # missing type declarations); the frontend build only needs dist/index.js.
      - name: Build plugin SDK
        working-directory: gameap-api/web/plugin-sdk
        run: |
          npm ci
          npm install --no-save ../frontend/packages/gameap-ui
          npx vite build

      - name: Build frontend
        working-directory: plugin-cs2-addons/frontend
        run: |
          npm ci
          npm run build

      # Installs the toolchain and targets pinned in rust-toolchain.toml
      - name: Set up Rust
        working-directory: plugin-cs2-addons
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugin-cs2-addons

      # A release is not the place to discover a broken build.
      - name: Test
        working-directory: plugin-cs2-addons
        run: |
          cargo test
          cd frontend && npm test

      - name: Build wasm
        working-directory: plugin-cs2-addons
        run: make wasm

      # Attaching to the GitHub release happens before the store upload, so a
      # store outage or a bad token still leaves a downloadable release.
      - name: Attach the wasm to the release
        working-directory: plugin-cs2-addons
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" cs2-addons.wasm --clobber

      # Optional: the store accepts unsigned uploads. Without the secret this
      # says so and moves on rather than failing the release.
      - name: Sign the wasm
        working-directory: plugin-cs2-addons
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          if [ -z "$GPG_SIGNING_KEY" ]; then
            echo "::notice::GPG_SIGNING_KEY is not set; publishing without a signature"
            exit 0
          fi
          printf '%s' "$GPG_SIGNING_KEY" | gpg --batch --import
          gpg --batch --yes --detach-sign --armor -o cs2-addons.wasm.asc cs2-addons.wasm

      # The GAMEAP_PLUGIN_ID variable is the opt-in: until the plugin is
      # registered on plugins.gameap.dev there is nothing to publish to, and
      # releases behave as they did before. Once it is set, a missing or
      # broken token fails the run rather than passing quietly.
      - name: Publish to plugins.gameap.dev
        working-directory: plugin-cs2-addons
        env:
          GAMEAP_DEPLOY_TOKEN: ${{ secrets.GAMEAP_DEPLOY_TOKEN }}
          GAMEAP_PLUGIN_ID: ${{ vars.GAMEAP_PLUGIN_ID }}
          TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ -z "$GAMEAP_PLUGIN_ID" ]; then
            echo "::notice::GAMEAP_PLUGIN_ID is not set; skipping the store upload"
            exit 0
          fi
          if [ -z "$GAMEAP_DEPLOY_TOKEN" ]; then
            echo "::error::GAMEAP_PLUGIN_ID is set but the GAMEAP_DEPLOY_TOKEN secret is missing"
            exit 1
          fi
          VERSION="${TAG#v}"
          printf '%s' "$RELEASE_BODY" > "$RUNNER_TEMP/changelog.md"
          ARGS=(--fail-with-body -sS
            -H "Authorization: Bearer ${GAMEAP_DEPLOY_TOKEN}"
            -F "version=${VERSION}"
            -F "file=@cs2-addons.wasm"
            -F "changelog=<${RUNNER_TEMP}/changelog.md"
            -F "min_gameap_version=${MIN_GAMEAP_VERSION}")
          # Signature is optional; send it only when the signing step made one.
          if [ -f cs2-addons.wasm.asc ]; then
            ARGS+=(-F "signature=@cs2-addons.wasm.asc")
          fi
          # is_stable defaults to false on the API, so a stable release has to
          # say so explicitly.
          if [ "$PRERELEASE" != "true" ]; then
            ARGS+=(-F "is_stable=true")
          fi
          # submit defaults to TRUE on the API: an upload would go straight to
          # the review queue. Uploading as a draft instead leaves a checkpoint
          # where the store's rendering of the changelog, the file hash and the
          # metadata can be read back before a reviewer sees them - which
          # matters because a version is immutable once uploaded and its number
          # can never be reused. Submit from the plugin page when it looks
          # right. Change to true here to submit automatically.
          ARGS+=(-F "submit=false")
          # No trailing slash: the router answers .../versions/ with a 301 and
          # curl does not replay the POST body on a redirect.
          curl "${ARGS[@]}"             "https://plugins.gameap.dev/api/ci/plugins/${GAMEAP_PLUGIN_ID}/versions"
