name: Release

# Publishing a GitHub release builds the wasm from the tagged commit and
# attaches it. Actions artifacts (see build.yml) are not a substitute: they
# expire, and only signed-in users can download them - a release asset is a
# permanent, anonymous URL, which is what the README points people at.
on:
  release:
    types: [published]

permissions:
  contents: write

env:
  # Ref of gameap/gameap providing web/plugin-sdk; pin to a SHA if the SDK
  # drifts from frontend/package-lock.json
  GAMEAP_REF: main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin-cs2-addons

      # The frontend depends on file:../../gameap-api/web/plugin-sdk, so the
      # gameap repo must be checked out as a sibling directory named gameap-api.
      # (The Rust side pulls gameap-plugin-sdk as a cargo git dependency.)
      - uses: actions/checkout@v4
        with:
          repository: gameap/gameap
          ref: ${{ env.GAMEAP_REF }}
          path: gameap-api

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            gameap-api/web/plugin-sdk/package-lock.json
            plugin-cs2-addons/frontend/package-lock.json

      # The tag is the source of truth for the version: it is written into the
      # two places the panel actually reads - PluginInfo (Cargo.toml) and the
      # frontend PluginDefinition - before anything is built, then verified.
      # A tag that disagrees with the committed version is not an error; the
      # tag wins, and the built artifact says so.
      - name: Set version from tag
        working-directory: plugin-cs2-addons
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          sed -i "s/^version = \".*\"$/version = \"${VERSION}\"/" Cargo.toml
          sed -i "s/^    version: '.*',$/    version: '${VERSION}',/" frontend/src/index.ts
          grep -q "^version = \"${VERSION}\"$" Cargo.toml
          grep -q "version: '${VERSION}'," frontend/src/index.ts

      # The @gameap/ui tarball on npm is missing its icons/ directory, so the
      # package from the gameap checkout is installed over it. SDK is built with
      # vite only ("npm run build" also runs tsc, which fails on @gameap/ui's
      # missing type declarations); the frontend build only needs dist/index.js.
      - name: Build plugin SDK
        working-directory: gameap-api/web/plugin-sdk
        run: |
          npm ci
          npm install --no-save ../frontend/packages/gameap-ui
          npx vite build

      - name: Build frontend
        working-directory: plugin-cs2-addons/frontend
        run: |
          npm ci
          npm run build

      # Installs the toolchain and targets pinned in rust-toolchain.toml
      - name: Set up Rust
        working-directory: plugin-cs2-addons
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugin-cs2-addons

      # A release is not the place to discover a broken build.
      - name: Test
        working-directory: plugin-cs2-addons
        run: |
          cargo test
          cd frontend && npm test

      - name: Build wasm
        working-directory: plugin-cs2-addons
        run: make wasm

      - name: Attach the wasm to the release
        working-directory: plugin-cs2-addons
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" cs2-addons.wasm --clobber
