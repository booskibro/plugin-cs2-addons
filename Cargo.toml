[package]
name = "cs2-addons"
version = "0.6.2"
edition = "2024"
license = "MIT"
publish = false
description = "GameAP plugin: manage Metamod:Source and CounterStrikeSharp on Counter-Strike 2 servers"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gameap-plugin-sdk = { git = "https://github.com/gameap/gameap-proto", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Catalog installs unpack release zips in-plugin (small archives only; big
# ones go through node-side curl+unzip). Deflate only — no time/crypto extras.
zip = { version = "2", default-features = false, features = ["deflate"] }

[workspace]

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
